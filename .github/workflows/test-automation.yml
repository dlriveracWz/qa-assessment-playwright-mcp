name: Production-Grade Test Automation Pipeline

on:
  push:
    branches:
      - main
      - 'submission-tier*/**'
      - 'submission/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-automation:
    name: Test Automation (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    env:
      CI: 'true'
      PLAYWRIGHT_JSON_REPORT: test-results/report.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Clean Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Typecheck & Static Code Analysis
        run: npm run typecheck

      - name: Run Security & Data Governance Unit Suite
        run: npx playwright test tests/unit/security-sanitizer.spec.ts

      - name: Run Playwright Regression Test Suite
        run: npx playwright test tests/regression --project=${{ matrix.browser }}

      - name: Upload Test Report & Trace Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Automated AI Test Failure Triage
        if: always()
        run: npm run triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLAYWRIGHT_JSON_REPORT: test-results/report.json